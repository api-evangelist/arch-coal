description: Core Natural Resources — the company Arch Coal / Arch Resources became after the January
  2025 merger with CONSOL Energy — does not publish a public API plans / pricing page. This artifact
  records the absence of a self-serve commercial surface; see notes for research findings.
notes: Arch Coal became Arch Resources in 2020 and merged with CONSOL Energy in January 2025 to form
  Core Natural Resources (NYSE:CNR). The combined company does not operate a commercial API program.
  Investor-relations data is published as filings and reports; the only machine-readable access to
  company data is the SEC's own EDGAR APIs.
