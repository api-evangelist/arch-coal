description: FOCUS-aligned FinOps placeholder for Core Natural Resources, the successor to Arch Coal /
  Arch Resources. No public billing-model details, meters, or invoice schema are published; this artifact
  records the absence so consumers know to source commercial terms from the provider directly.
notes: Arch Coal became Arch Resources in 2020 and merged with CONSOL Energy in January 2025 to form
  Core Natural Resources (NYSE:CNR). The combined company does not operate a commercial API program.
  Investor-relations data is published as filings and reports rather than through a paid API.
