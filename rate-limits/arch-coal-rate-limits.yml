description: Core Natural Resources — the successor to Arch Coal / Arch Resources after the January 2025
  CONSOL Energy merger — does not publish concrete rate-limit numbers, throttling thresholds, or
  response-header conventions. This artifact records the gap; see notes for research findings.
notes: No public rate-limit documentation — there is no commercial API with published throttling rules.
  Consumers pulling this company's filings should follow the SEC EDGAR fair-access policy (10 requests
  per second, declared User-Agent) rather than any company-published limit.
