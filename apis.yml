- type: Features
  data:
  - name: Metallurgical Coal
    description: Low-Vol (Beckley, Itmann), High-Vol A (Leer, Leer South), and High-Vol B (Mountain Laurel)
      metallurgical coals for blast furnace steelmaking — roughly 12 million tons annually.
  - name: High Calorific Value Thermal Coal
    description: High CV thermal coal from the Pennsylvania Mining Complex and West Elk mine for power
      generation, cement, and industrial use — roughly 30 million tons annually.
  - name: Powder River Basin Thermal Coal
    description: PRB sub-bituminous coal from Black Thunder and Coal Creek mines in Wyoming.
  - name: Marine Export Terminals
    description: Ownership stakes in East Coast marine export terminals, with roughly 25 million tons
      of owned annual export capacity.
  - name: CONSOL Innovations
    description: Advanced materials and critical mineral extraction research turning coal-based carbon
      into products for aerospace and other industries.
  - name: SEC Filings and Investor Reporting
    description: Quarterly earnings, production and sales volume reporting, and SEC filings published
      as HTML and PDF through the investor relations portal and EDGAR.
- type: UseCases
  data:
  - name: Investment Research
    description: Analyze Core Natural Resources (NYSE:CNR) financial performance, production volumes,
      and market position through EDGAR filings and investor materials.
  - name: Merger and Lineage Tracking
    description: Follow the Arch Coal → Arch Resources → Core Natural Resources lineage, including the
      CONSOL Energy merger of equals completed January 2025.
  - name: ESG and Safety Reporting
    description: Access environmental, safety, and governance disclosures published through the corporate
      sustainability section.
  - name: Supply Chain and Procurement
    description: Steel producers, utilities, and suppliers reference product specifications, terms and
      conditions, and the Supplier Code of Conduct.
  - name: Commodity Market Analysis
    description: Track metallurgical and thermal coal production, export capacity, and sales volumes
      for commodity market research.
- type: Integrations
  data:
  - name: SEC EDGAR
    description: All filings for CIK 0001710366 are available through EDGAR and the SEC's public JSON
      APIs at data.sec.gov.
  - name: NYSE
    description: Shares trade on the New York Stock Exchange under the ticker CNR; market data flows
      through standard exchange and market data providers.
