aid: arch-coal
name: Arch Coal
description: >-
  Arch Coal was a St. Louis-based producer and marketer of metallurgical and
  thermal coal, renamed Arch Resources in 2020. In January 2025 Arch Resources
  merged with CONSOL Energy in a merger of equals to form Core Natural
  Resources, Inc. (NYSE: CNR), headquartered in Canonsburg, Pennsylvania. The
  combined company operates the Pennsylvania Mining Complex, Leer, Leer South,
  West Elk, Black Thunder, and other mines across six U.S. states with 5,000+
  employees, and holds stakes in East Coast marine export terminals. Core
  Natural Resources does not publish a public developer API. Its external
  digital surface is a corporate website at corenaturalresources.com plus a
  separate investor relations portal, both serving HTML and PDF only — the
  investor portal's /rss and /feed paths were probed on 2026-07-25 and every
  one returns HTML, not XML. Machine-readable company data is available only
  through third-party channels, namely the SEC's own EDGAR APIs.
