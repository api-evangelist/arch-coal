apis:
- aid: arch-coal:sec-edgar-filings
  name: SEC EDGAR Filings (Core Natural Resources, CIK 1710366)
  description: >-
    Machine-readable filing data for Core Natural Resources is available from
    the U.S. Securities and Exchange Commission, not from the company. The SEC
    EDGAR submissions API returns the full filing history for CIK 0001710366
    (formerly CONSOL Energy Inc., renamed Core Natural Resources in January
    2025) as JSON. This is a third-party government API listed here because it
    is the only real programmatic access to this company's data.
  humanURL: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
  tags:
  - Filings
  - SEC EDGAR
  - Third-Party
  properties:
  - type: Documentation
    url: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
  - type: APIReference
    url: https://data.sec.gov/submissions/CIK0001710366.json
  x-evidence:
    verified: '2026-07-25'
    method: fetched documentation and called the endpoint
    documentation: >-
      The SEC's EDGAR APIs page documents RESTful JSON APIs on data.sec.gov —
      https://data.sec.gov/submissions/CIK##########.json plus the XBRL
      companyconcept, companyfacts, and frames APIs. No authentication or API
      key required; a declared User-Agent and a 10-request-per-second ceiling
      are the stated fair-access terms.
    endpoint_check: >-
      GET https://data.sec.gov/submissions/CIK0001710366.json returned HTTP 200
      with JSON naming "Core Natural Resources, Inc.", ticker CNR, and the
      former name "CONSOL Energy Inc." through 2025-01-10.
